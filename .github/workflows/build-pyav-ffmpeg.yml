name: Build PyAV with minimal FFmpeg (Windows x64)

on:
  workflow_dispatch:
  push:
    tags:
      - "pyav-ffmpeg-*"

permissions:
  contents: write

env:
  FFMPEG_VERSION: "8.1.3"
  FFMPEG_PREFIX: "C:\\ffmpeg-min\\install-8.1.3"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out PyAV source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # FFmpeg's --toolchain=msvc requires the Visual Studio compiler/linker.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Use MSYS2 for bash, make, tar, and nasm, while inheriting MSVC's environment.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: >-
            base-devel
            curl
            nasm
            xz

      - name: Build FFmpeg shared libraries
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          # Prefer MSVC's link.exe over any similarly named MSYS utility.
          if [[ -n "${VCToolsInstallDir:-}" ]]; then
            export PATH="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64:$PATH"
          fi
          command -v cl
          command -v link

          curl --fail --location --retry 3 \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            --output "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar -xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          cd "ffmpeg-${FFMPEG_VERSION}"

          ./configure \
            --toolchain=msvc \
            --prefix=/c/ffmpeg-min/install-8.1.3 \
            --disable-autodetect \
            --disable-everything \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-static \
            --enable-shared \
            --enable-pic \
            --enable-avcodec \
            --enable-avdevice \
            --enable-avformat \
            --enable-avutil \
            --enable-avfilter \
            --enable-swscale \
            --enable-swresample \
            --enable-protocol=file \
            --enable-demuxer=mov,gif \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=av1 \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=av1 \
            --enable-filter=scale,fps,format

          make -j"$(nproc)"
          make install

      - name: Build a PyAV wheel against the custom FFmpeg
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython delvewheel
          python setup.py bdist_wheel "--ffmpeg-dir=$env:FFMPEG_PREFIX"
          if ($LASTEXITCODE -ne 0) { throw "PyAV wheel build failed" }

          New-Item -ItemType Directory -Force wheelhouse | Out-Null
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No PyAV wheel was produced" }
          delvewheel repair --add-path "$env:FFMPEG_PREFIX\bin" -w wheelhouse $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "delvewheel repair failed" }

      - name: Package the FFmpeg SDK and DLLs
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "ffmpeg-sdk"
          New-Item -ItemType Directory -Force `
            "$stage\bin", "$stage\include", "$stage\lib" | Out-Null

          Copy-Item "$env:FFMPEG_PREFIX\bin\*.dll" "$stage\bin\" -ErrorAction Stop
          Copy-Item "$env:FFMPEG_PREFIX\lib\*.lib" "$stage\lib\" -ErrorAction Stop
          Copy-Item "$env:FFMPEG_PREFIX\include\*" "$stage\include\" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\ffmpeg-$($env:FFMPEG_VERSION)\COPYING.LGPLv2.1" $stage

          $sdkZip = Join-Path $env:GITHUB_WORKSPACE "ffmpeg-$($env:FFMPEG_VERSION)-win_amd64-sdk.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $sdkZip -Force

      - name: Smoke-test the repaired wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No repaired wheel was produced" }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installing the wheel failed" }

          # Leave the checkout so Python imports the installed wheel, not the source tree.
          Set-Location $env:RUNNER_TEMP
          python -c "import av; print('PyAV:', av.__version__); print('FFmpeg libraries:', av.library_versions)"
          if ($LASTEXITCODE -ne 0) { throw "Importing the installed wheel failed" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v8
        with:
          name: pyav-ffmpeg-${{ env.FFMPEG_VERSION }}-win_amd64
          path: |
            wheelhouse/*.whl
            ffmpeg-${{ env.FFMPEG_VERSION }}-win_amd64-sdk.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/pyav-ffmpeg-')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            wheelhouse/*.whl
            ffmpeg-${{ env.FFMPEG_VERSION }}-win_amd64-sdk.zip
